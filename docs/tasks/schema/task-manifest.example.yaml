taskId: "task-001-phone-ui-document-controller-refactor"
featureName: "스마트폰 가상 OS UI Document 컨트롤러 분리 및 상태 바인딩 정비"

coreLoopContext:
  domain: "VirtualOS_2D"
  intent: "PhoneUIDocumentController의 임시 프로토타입 코드를 순수 뷰 컴포넌트로 분리하고, 런타임 캐싱을 적용하여 GC 부하를 0 Byte로 억제한다."
  edgeCases:
    - "스마트폰 닫기(ESC 키 또는 외부 영역 클릭) 시 현재 열려 있는 UWB 창이나 팝업이 함께 닫혀야 함"
    - "전투 진입(다이브) 버튼 클릭 시 Phone UI 인스턴스가 안전하게 비활성화되어 백그라운드 연산을 중단해야 함"

stateAndDataSpec:
  targetFSM: "PhoneViewState: Closed -> Home -> AppOpened -> Inactive"
  dataStructures:
    - "PhoneAppConfigSO"
    - "NotificationLogData"
  uiBindings:
    - "#phone-root"
    - "#app-grid-container"
    - "#btn-dive-battle"
    - "#txt-sync-status"

boundaryConstraints:
  allowedPaths:
    - "Assets/Scripts/PhoneUIDocumentController.cs"
    - "Assets/Scripts/PhoneUIController.cs"
    - "Assets/UI/"
  prohibitedPaths:
    - "Assets/Scripts/Core/"
    - "Assets/Scripts/Combat/"
    - "Assets/Editor/StudyGameDirector/"
    - "*.meta"
  forbiddenPatterns:
    - "Update() 내 VisualElement.Q<T>() 호출 금지 (InitializeView 시점에 1회 캐싱)"
    - "람다 클로저를 사용한 동적 이벤트 등록 (() => { ... })"

definitionOfDone:
  - "유니티 에디터 컴파일 성공 및 콘솔 Warning/Error 0건"
  - "플레이 모드에서 Phone UI 열기/닫기 10회 반복 시 GC Allocation 0 Byte 유지"
  - "Assets/Editor/ 및 Assets/Scripts/Core/ 파일 무수정 확인"
